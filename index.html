    <title>مصاريف — إدارة الميزانية</title>
    <script>
      /*
       * تطبيق المظهر قبل أول رسم — بلا وميض.
       *
       * لماذا سكربت مبكّر وليس في React؟ لأن React يُحمَّل بعد تنزيل الحزمة،
       * فلو انتظرنا لقفزت الصفحة من الداكن إلى الفاتح أمام المستخدم في كل فتح
       * للتطبيق. هذا السكربت متزامن ويعمل قبل رسم أي بكسل.
       *
       * والاختيار محفوظ في localStorage (لا في IndexedDB) لأن قراءته هنا يجب
       * أن تكون متزامنة. التفاصيل الكاملة في src/core/theme.ts.
       *
       * «تلقائي» = لا نكتب السمة إطلاقاً، فيتولّى CSS (prefers-color-scheme)
       * الأمر ويبقى التطبيق حيّاً مع تغيّر نظام الجهاز.
       */
      (function () {
        try {
          var t = localStorage.getItem('money.theme');
          var dark = true;
          try {
            var prefersLight = window.matchMedia('(prefers-color-scheme: light)').matches;
            dark = t === 'dark' ? true : t === 'light' ? false : !prefersLight;
          } catch (e) {
            dark = t === 'light' ? false : true;
          }
          if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
          var bar = document.querySelector('meta[name="apple-mobile-web-app-status-bar-style"]');
          if (bar) bar.setAttribute('content', dark ? 'black-translucent' : 'default');
        } catch (e) {
          /* أي فشل ⇒ نبقى على الافتراضي الداكن، والتطبيق يعمل */
        }
      })();
    </script>
